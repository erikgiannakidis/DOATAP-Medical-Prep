name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: doatap_test
          POSTGRES_USER: doatap_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doatap_test -d doatap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: SQLite and UI checks
        run: python -m pytest -q
      - name: PostgreSQL persistence checks
        run: python -m pytest tests/test_service.py -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://doatap_test:ci_test_password@localhost:5432/doatap_test
      - name: Check Docker image builds
        run: docker build -t doatap-prep:ci .
